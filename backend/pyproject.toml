[project]
name = "capture-system-backend"
version = "0.1.0"
description = "Backend for collecting and processing traffic-sign capture events uploaded from an Android application."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "supabase>=2.9.1",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.4",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
# Heavy computer-vision / ML stack. Not required to run the API or worker
# with the stub AI pipeline; install only on the machine that will run real
# inference (e.g. the M1 MacBook) once real models are implemented.
ai = [
    "ultralytics>=8.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.44.0",
    "faiss-cpu>=1.8.0",
    "pillow>=10.4.0",
    "loguru>=0.7.2",
]
# Test/lint tooling. Install with `uv sync --extra dev`.
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "tests_ai"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
